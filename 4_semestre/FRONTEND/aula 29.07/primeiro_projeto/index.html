<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Primeiro Projeto</title>
  </head>
  <body>
    <header class="cabecalho">
      <div class="container">
        <span class="etiqueta">VIte + JavaScript</span>
        <h1>Meu Primeiro projeto com Vite!!</h1>
      </div>
    </header>
    <main class="container conteudo-principal">
      <section class="card">
        <h2 id="titulo-contator">Contador</h2>
        <p class="descricao">Use os botões abaixo para alterar o valor</p>
        <div class="painel-valor">
          <span>Valor Atual</span>
          <strong id="valor">0</strong>
        </div>
        <div class="acoes">
          <button id="diminuir" class="botao botao-segundario" type="button">Diminuir</button>
          <button id="zerar" class="botao botao-neutro" type="button">Zerar</button>
          <button id="aumentar" class="botao botao-primario" type="button">Aumentar</button>
        </div>
      </section>
    </main>
    <footer>
      <p>SESI/SENAI Desenvolvimento de Sistemas &copy;</p>
    </footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
